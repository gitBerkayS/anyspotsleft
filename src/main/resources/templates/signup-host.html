<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>anyspotsleft | create an account</title>
    <link rel="stylesheet" th:href="@{/css/stylesheet.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo"> <a th:href="@{/}"><img th:src="@{/images/logo.png}"></a></div>
</header>

<div class="signup-container">
    <div class="signup">
        <h1>Create a host account</h1>
        <form>
            <input type="text" id="name" name="name" placeholder="Name" autocomplete="off" required>
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="off" required>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="off" required>
            <button type="submit" name="submit">Continue</button>
        </form>
        <p class="login-text">Already have an account? <a th:href="@{/login}"> Log in</a></p>

        <div class="oauth-divider">
            <hr><span>OR</span><hr>
        </div>

        <div class="oauth-buttons">
            <button class="oauth-btn apple"> Sign up with Apple</button>
            <button class="oauth-btn google">G Sign up with Google</button>
        </div>
    </div>
</div>

</body>
</html>

<script>
    document.querySelector('form button[type="submit"]').addEventListener('click', (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value;

        const data = {
            email,
            password,
            name
        }

        const jsonData = JSON.stringify(data);
        console.log(jsonData);
        console.log(data)
        fetch('/signup/host', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: jsonData
        })
            .then(async response => {
                if (response.ok) {
                    alert('Account created successfully!');
                    window.location.href = '/login';
                } else {
                    const msg = await response.text();
                    alert('Signup failed: ' + msg);
                }
            })
            .catch(error => {
                console.error(error);
                alert('Something went wrong. Try again later.');
            });
    })
</script>
